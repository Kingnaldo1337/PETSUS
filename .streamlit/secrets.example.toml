# Copie para secrets.toml somente no ambiente privado e preencha os valores.
# O arquivo secrets.toml é ignorado pelo Git.
PETSUS_SMTP_HOST = "smtp.exemplo.com"
PETSUS_SMTP_PORT = "587"
PETSUS_SMTP_USERNAME = "preencher"
PETSUS_SMTP_PASSWORD = "preencher"
PETSUS_SMTP_FROM = "nao-responda@exemplo.com"
PETSUS_SMTP_SECURITY = "starttls"
PETSUS_REQUIRE_MFA = "true"

# Duas contas específicas para testar a base demonstrativa, sem código de e-mail.
# Senhas ficam somente nos Secrets privados; nunca publique credenciais reais.
PETSUS_TEST_MODE = "false"
# PETSUS_TEST_GESTOR_CPF = "11111111111"
# PETSUS_TEST_GESTOR_SENHA = "DEFINA_UMA_SENHA_FORTE"
# PETSUS_TEST_PACIENTE_CPF = "22222222222"
# PETSUS_TEST_PACIENTE_SENHA = "DEFINA_OUTRA_SENHA_FORTE"
# PETSUS_TEST_PACIENTE_ID = "PACIENTE_LIVRE_DA_BASE" # opcional

# Recuperação excepcional do único gestor legado sem e-mail.
# Exige CPF e senha corretos no login; o código por e-mail continua obrigatório.
# Desative após conseguir entrar. Não substitui um e-mail válido já cadastrado.
PETSUS_RECUPERAR_EMAIL_GESTOR = "false"
# PETSUS_GESTOR_CPF = "CPF de 11 dígitos da conta existente"
# PETSUS_GESTOR_EMAIL = "email-do-gestor@exemplo.com"

PETSUS_DATA_OWNER = "Equipe responsável pela conferência"
PETSUS_UPDATE_INTERVAL_DAYS = "7"
# Contatos são exibidos como texto; cadastre os canais reais da equipe.
PETSUS_SUPPORT_CONTACT = ""
PETSUS_LEGAL_CONTACT = ""
PETSUS_LEGAL_CONTACT_URL = ""
