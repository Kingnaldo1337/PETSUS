name: petsus

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PETSUS_DATABASE_FILE: /app/data/usuarios.db
      PETSUS_DATA_FILE: /app/dados_dashboard_saude.xlsx
      PETSUS_GESTOR_CPF: ${PETSUS_GESTOR_CPF:-}
      PETSUS_GESTOR_SENHA: ${PETSUS_GESTOR_SENHA:-}
      PETSUS_GESTOR_NOME: ${PETSUS_GESTOR_NOME:-Gestor}
      PETSUS_GESTOR_DATA_NASCIMENTO: ${PETSUS_GESTOR_DATA_NASCIMENTO:-}
      PETSUS_CPF_PEPPER: ${PETSUS_CPF_PEPPER:-}
      PETSUS_SMTP_HOST: ${PETSUS_SMTP_HOST:-}
      PETSUS_SMTP_PORT: ${PETSUS_SMTP_PORT:-587}
      PETSUS_SMTP_USERNAME: ${PETSUS_SMTP_USERNAME:-}
      PETSUS_SMTP_PASSWORD: ${PETSUS_SMTP_PASSWORD:-}
      PETSUS_SMTP_FROM: ${PETSUS_SMTP_FROM:-}
      PETSUS_SMTP_SECURITY: ${PETSUS_SMTP_SECURITY:-starttls}
    volumes:
      - petsus_sqlite:/app/data
    expose:
      - "8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PETSUS_DOMAIN: ${PETSUS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    security_opt:
      - no-new-privileges:true

volumes:
  petsus_sqlite:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
